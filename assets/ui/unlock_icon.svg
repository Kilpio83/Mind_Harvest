<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- body, shifted left so the free right arm clearly clears it -->
  <rect x="2" y="11" width="12" height="11" rx="2.5" fill="#1A1510" fill-opacity="0.6" stroke="#D4A843" stroke-width="2.0"/>
  <!-- keyhole centered in body -->
  <circle cx="8" cy="16" r="1.9" fill="#D4A843"/>
  <rect x="7.1" y="16" width="1.8" height="2.8" rx="0.9" fill="#D4A843"/>
  <!--
    Shackle rotated open:
      - left arm enters body at (5,11), the hinge point
      - arm rises to (5,6)
      - arc sweeps clockwise from (5,6) to (17,6) — the U-top now faces right
      - right arm hangs down from (17,6) to (17,10), free and to the right of the body
  -->
  <path d="M5 11V6A6 6 0 0 1 17 6V10"
        fill="none" stroke="#D4A843" stroke-width="2.3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
